# GorilaGym · Dokploy (tipo "Compose") o docker compose local
services:
  gorilagym:
    build: .
    restart: unless-stopped
    expose:
      - "80"
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@gorilagym.cl}
      SMTP_TLS: ${SMTP_TLS:-on}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-on}
      SMTP_AUTH: ${SMTP_AUTH:-on}
      GG_CRON: ${GG_CRON:-1}
    volumes:
      - gorilagym-storage:/var/www/html/private/storage
      - gorilagym-media:/var/www/html/media
    # Límites del contenedor (app + SQLite + cron viven aquí). Ajustables con variables en Dokploy.
    deploy:
      resources:
        limits:
          cpus: "${GG_CPUS:-1.0}"
          memory: ${GG_MEMORY:-1g}
        reservations:
          memory: ${GG_MEMORY_RESERVATION:-256m}
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gorilagym-storage:
  gorilagym-media:
